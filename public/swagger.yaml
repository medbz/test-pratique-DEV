openapi: 3.0.3
info:
  title: Offers API
  description: >
    Mobile plans catalogue used by the technical test. Served locally by MSW.
  version: 2.0.0
servers:
  - url: /api
    description: Local mock (MSW)

paths:
  /offers:
    get:
      summary: List the available mobile plans
      operationId: getOffers
      tags:
        - Offer
      responses:
        "200":
          description: List of mobile plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

components:
  schemas:
    Offer:
      type: object
      required: [id, name, price, data, categories]
      properties:
        id:
          type: string
          example: "3"
        name:
          type: string
          example: Sensation 5G 150Go
        price:
          type: number
          format: float
          description: Monthly price in euros
          example: 29.99
        data:
          type: string
          description: Data allowance
          example: 150 GB
        categories:
          type: array
          items:
            type: string
          example: [5G, Europe, Smartphone]
